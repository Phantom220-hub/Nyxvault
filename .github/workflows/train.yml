name: NYXVAULT train and test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train local model from the project corpus
        run: python train.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Save trained model index
        uses: actions/upload-artifact@v4
        with:
          name: nyxvault-trained-index
          path: data/model_index.json
          if-no-files-found: error
          retention-days: 14
