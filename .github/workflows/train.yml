name: NYXVAULT train and test

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train both local models
        run: python train.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Save trained models and training report
        uses: actions/upload-artifact@v4
        with:
          name: nyxvault-trained-models
          path: |
            data/model_index.json
            data/neural_model.npz
            data/training_report.json
          if-no-files-found: error
          retention-days: 14
