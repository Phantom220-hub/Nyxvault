name: NYXVAULT train and test

permissions:
  contents: write

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  train:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Train both local models
        run: python train.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Save trained models and training report
        uses: actions/upload-artifact@v4
        with:
          name: nyxvault-trained-models
          path: |
            data/model_index.json
            data/neural_model.npz
            data/training_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist checkpoint in dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/neural_model.npz data/model_index.json data/training_report.json
          if git diff --cached --quiet; then
            echo "No checkpoint changes to save"
            exit 0
          fi
          git commit -m "chore: persist NYXVAULT training checkpoint"
          git push origin HEAD:dev
