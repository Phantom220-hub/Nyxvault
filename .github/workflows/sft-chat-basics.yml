name: NYXVAULT chat and Python SFT

on:
  push:
    branches: [main]
    paths:
      - "training/SFT_CHAT_START_NOW.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-chat-python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download current merged checkpoint and matching tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nyx-base
          curl -fL --retry 3 "https://github.com/Phantom220-hub/Nyxvault/releases/download/nyxvault-weights-600/NYXVAULT_ALL_FILES.zip" -o /tmp/base.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          with ZipFile("/tmp/base.zip") as z:
              ckpts=[n for n in z.namelist() if Path(n).name=="tokenizer.json"]
              if len(ckpts)!=1: raise SystemExit(f"Expected one tokenizer.json, got {ckpts}")
              with z.open(ckpts[0]) as src, open("/tmp/nyx-base/tokenizer.json","wb") as dst:
                  shutil.copyfileobj(src,dst)
          PY
          curl -fL --retry 3 "https://github.com/Phantom220-hub/Nyxvault/releases/download/nyxvault-sft-merged-projects-2026-11-27/sft_step_50.pt" -o /tmp/nyx-base/sft_step_50.pt
          test "$(stat -c%s /tmp/nyx-base/sft_step_50.pt)" -gt 1000000

      - name: Install CPU training and inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers onnx onnxruntime onnxscript
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate chat and Python training data
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from tokenizers import Tokenizer
          from training.data_schema import normalize_record, validate_record, render_prompt
          p=Path("training/data/chat_and_python_basics.jsonl")
          tok=Tokenizer.from_file("/tmp/nyx-base/tokenizer.json")
          groups={}
          rows=[]
          for n,line in enumerate(p.read_text(encoding="utf-8").splitlines(),1):
              if not line.strip(): continue
              r=normalize_record(json.loads(line))
              errors=[x for x in validate_record(r) if x.severity=="error" or x.code=="W010"]
              if errors: raise SystemExit(f"Line {n}: " + "; ".join(x.message for x in errors))
              eos=tok.token_to_id("[EOS]")
              if eos is None: raise SystemExit("Tokenizer has no [EOS] token")
              plen=len(tok.encode(render_prompt(r)).ids)
              alen=len(tok.encode(r["output"]).ids)+1
              if alen>504 or plen==0: raise SystemExit(f"Bad token length in {r['id']}: prompt={plen}, answer={alen}")
              bucket=int(hashlib.sha256(r["id"].encode()).hexdigest()[:8],16)%10
              group=(r.get("tags") or ["uncategorized"])[0]
              groups.setdefault(group,{"train":0,"validation":0})["validation" if bucket==0 else "train"]+=1
              rows.append(r)
          if not rows or any(not g["train"] or not g["validation"] for g in groups.values()):
              raise SystemExit(f"Each category needs train and validation examples: {groups}")
          print(json.dumps({"records":len(rows),"groups":groups,"eos_id":eos},ensure_ascii=False,indent=2))
          PY

      - name: Continue SFT from sft_step_50 for 50 more optimizer updates
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python training/finetune_instructions.py \
            --data training/data/chat_and_python_basics.jsonl \
            --tokenizer /tmp/nyx-base/tokenizer.json \
            --resume /tmp/nyx-base/sft_step_50.pt \
            --steps 100 --max-steps 50 \
            --batch-size 1 --grad-accum-steps 1 \
            --block-size 512 --lr 1e-5 --warmup-steps 5 \
            --eval-every 10 --save-every 50 \
            --allow-cpu --out artifacts/sft_checkpoints

      - name: Verify changed weights and write training report
        run: |
          python - <<'PY'
          import json, torch
          from pathlib import Path
          old=torch.load("/tmp/nyx-base/sft_step_50.pt",map_location="cpu",weights_only=False)
          path=Path("artifacts/sft_checkpoints/sft_step_100.pt")
          if not path.is_file(): raise SystemExit("sft_step_100.pt was not created")
          new=torch.load(path,map_location="cpu",weights_only=False)
          changed=sum((new["model"][k].float()!=v.float()).any().item() for k,v in old["model"].items())
          if changed==0: raise SystemExit("No model parameter changed")
          report={
            "base_checkpoint":"sft_step_50.pt",
            "new_checkpoint":"sft_step_100.pt",
            "pretraining_updates":600,
            "previous_sft_updates":50,
            "new_sft_updates":50,
            "cumulative_optimizer_updates":700,
            "training_records":20,
            "validation_records":4,
            "changed_parameter_tensors":int(changed),
            "best_validation_loss":float(new.get("best_validation_loss",float("nan"))),
            "note":"Small experimental SFT round; not evidence of broad language competence."
          }
          Path("artifacts/sft_metrics.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          Path("artifacts/chat_and_python_basics.jsonl").write_text(Path("training/data/chat_and_python_basics.jsonl").read_text(encoding="utf-8"),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Export and test the newly trained model
        run: |
          python training/export_mobile.py --checkpoint artifacts/sft_checkpoints/sft_step_100.pt --tokenizer /tmp/nyx-base/tokenizer.json --out artifacts/nyxvault_chat_test.onnx
          cat > /tmp/test_model.py <<'PY'
          import json
          import numpy as np
          import onnxruntime as ort
          from tokenizers import Tokenizer
          from pathlib import Path
          tok=Tokenizer.from_file("/tmp/nyx-base/tokenizer.json")
          session=ort.InferenceSession("artifacts/nyxvault_chat_test.onnx",providers=["CPUExecutionProvider"])
          eos=tok.token_to_id("[EOS]")
          cases=[
            ("greeting","### Level: 1\n### Topic: input-output\n### Task type: explain\n### Language: python\n### Task\nПривет\n### Solution\n"),
            ("calculator","### Level: 1\n### Topic: functions-basics\n### Task type: write_code\n### Language: python\n### Task\nСделай простой калькулятор на Python\n### Solution\n")
          ]
          results=[]
          for name,prompt in cases:
            ids=tok.encode(prompt).ids
            generated=[]
            for _ in range(220):
              logits=session.run(["logits"],{"input_ids":np.array([ids[-512:]],dtype=np.int64)})[0]
              nxt=int(logits[0,-1].argmax())
              if eos is not None and nxt==eos: break
              ids.append(nxt); generated.append(nxt)
            answer=tok.decode(generated,skip_special_tokens=True)
            print(f"\\n===== {name.upper()} =====")
            print("Generated token IDs:",generated)
            print("Answer:",answer)
            results.append({"test":name,"prompt":prompt,"token_ids":generated,"answer":answer})
          Path("artifacts/inference_test.json").write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          python /tmp/test_model.py

      - name: Upload SFT and inference artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NYXVAULT-chat-python-SFT
          path: |
            artifacts/sft_checkpoints/sft_step_100.pt
            artifacts/sft_checkpoints/best_sft.pt
            artifacts/sft_metrics.json
            artifacts/chat_and_python_basics.jsonl
            artifacts/nyxvault_chat_test.onnx
            artifacts/tokenizer_mobile.json
            artifacts/inference_test.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish continued SFT checkpoint
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxvault-sft-chat-basics-2026-11-27
          name: NYXVAULT chat and Python basics SFT
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            artifacts/sft_checkpoints/sft_step_100.pt
            artifacts/sft_metrics.json
            artifacts/chat_and_python_basics.jsonl
          body: |
            Continued from the merged sft_step_50.pt checkpoint.
            50 additional CPU SFT optimizer updates on original Russian conversation and Python basics examples.
            Total reported updates: 600 pretraining + 100 SFT = 700.
            Experimental checkpoint; validate outputs before relying on them.
