name: NYXVAULT Transformer smoke tests

on:
  push:
    branches: [dev]
    paths:
      - "training/**"
      - "data/knowledge.jsonl"
      - "DATA_SOURCES.md"
      - "TRAINING_GUIDE.md"
  pull_request:
    branches: [dev]
    paths:
      - "training/**"
      - "data/knowledge.jsonl"
      - "DATA_SOURCES.md"
      - "TRAINING_GUIDE.md"

permissions:
  contents: read

jobs:
  transformer-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile training scripts
        run: |
          python -m py_compile training/model.py training/train.py training/prepare_data.py training/train_tokenizer.py training/evaluate.py training/smoke_test.py
      - name: Test causal attention and gradients
        run: python training/smoke_test.py
      - name: Build programming-focused dataset
        run: |
          mkdir -p /tmp/nyxvault-raw
          cp training/programming_seed.jsonl /tmp/nyxvault-raw/
          python training/prepare_data.py --input /tmp/nyxvault-raw --knowledge data/knowledge.jsonl --out /tmp/nyxvault-data
          python training/train_tokenizer.py --input /tmp/nyxvault-data/train.txt --output /tmp/nyxvault-tokenizer.json --vocab-size 8000
