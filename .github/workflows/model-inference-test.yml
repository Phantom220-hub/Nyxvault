name: NYXVAULT single-model continuous training

on:
  push:
    branches: [main]
    paths:
      - "training/data/*.jsonl"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyxvault-single-model-main
  cancel-in-progress: false

jobs:
  continue-canonical-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main and fetch the canonical LFS model bundle
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack the one canonical model and verify its manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s NYXVAULT_MODEL.zip
          mkdir -p /tmp/nyx-current /tmp/nyx-next
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import json, shutil
          archive=Path("NYXVAULT_MODEL.zip")
          with ZipFile(archive) as z:
              bad=z.testzip()
              if bad: raise SystemExit("Canonical model ZIP is corrupt: "+bad)
              required={"model.pt","tokenizer.json","base_step_600_backup.pt","training_corpus.jsonl","manifest.json"}
              names=set(z.namelist())
              missing=required-names
              if missing: raise SystemExit(f"Canonical model missing members: {sorted(missing)}")
              for name in required | {"model.onnx","tokenizer_mobile.json","inference_test.json"}:
                  if name in names:
                      z.extract(name,"/tmp/nyx-current")
          manifest=json.loads(Path("/tmp/nyx-current/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("canonical_checkpoint")!="model.pt":
              raise SystemExit("Unexpected canonical checkpoint in manifest")
          if not Path("/tmp/nyx-current/model.pt").is_file():
              raise SystemExit("Canonical model.pt was not extracted")
          print("Loaded canonical model:",manifest.get("name"),"checkpoint:",manifest.get("checkpoint_internal_step"))
          PY

      - name: Install CPU training and ONNX export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers onnx onnxruntime onnxscript
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Extend the canonical corpus with new main-branch data
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path
          from tokenizers import Tokenizer
          from training.data_schema import normalize_record, validate_record
          tok=Tokenizer.from_file("/tmp/nyx-current/tokenizer.json")
          prior=Path("/tmp/nyx-current/training_corpus.jsonl")
          seen_tasks=set()
          seen_ids=set()
          rows=[]
          rejected=Counter()
          def add_file(path, label, existing=False):
              for line_no,line in enumerate(path.read_text(encoding="utf-8").splitlines(),1):
                  if not line.strip(): continue
                  try:
                      rec=normalize_record(json.loads(line))
                      if not isinstance(rec,dict): raise ValueError("not an object")
                      issues=[x for x in validate_record(rec) if x.severity=="error" or x.code=="W010"]
                      if issues: raise ValueError("; ".join(x.message for x in issues[:2]))
                      task=(rec["instruction"],rec.get("input",""))
                      if task in seen_tasks:
                          rejected[label+"_duplicate"]+=1
                          continue
                      if len(tok.encode(rec["output"]).ids)+1>504:
                          rejected[label+"_answer_too_long"]+=1
                          continue
                      old_id=str(rec["id"])
                      new_id="u_"+hashlib.sha256((label+"\0"+old_id+"\0"+rec["instruction"]).encode()).hexdigest()[:24]
                      if new_id in seen_ids:
                          rejected[label+"_duplicate_id"]+=1
                          continue
                      rec["id"]=new_id
                      rec["tags"]=["nyxvault_unified"]
                      rec["source"]=f"canonical corpus / {label}; original={rec.get('source','')}"
                      rows.append(rec)
                      seen_tasks.add(task)
                      seen_ids.add(new_id)
                  except Exception as exc:
                      rejected[label+"_invalid"]+=1
                      if rejected[label+"_invalid"]<=3:
                          print(f"Skipped {label} line {line_no}: {exc}")
          add_file(prior,"previous_canonical_corpus",True)
          for path in sorted(Path("training/data").glob("*.jsonl")):
              add_file(path,path.name)
          if len(rows)<500:
              raise SystemExit(f"Unified corpus unexpectedly small: {len(rows)}")
          out=Path("/tmp/nyx-next/training_corpus.jsonl")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text("".join(json.dumps(r,ensure_ascii=False)+"\n" for r in rows),encoding="utf-8")
          report={
              "total_records":len(rows),
              "unique_tasks":len(seen_tasks),
              "rejected":dict(rejected),
              "training_sources":["previous canonical bundle","training/data/*.jsonl on main"],
              "tokenizer_vocab_size":tok.get_vocab_size()
          }
          Path("/tmp/nyx-next/corpus_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Validate canonical checkpoint, tokenizer and full corpus
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python - <<'PY'
          import json, torch
          from pathlib import Path
          from tokenizers import Tokenizer
          from training.finetune_instructions import make_samples
          checkpoint=torch.load("/tmp/nyx-current/model.pt",map_location="cpu",weights_only=False)
          tokenizer=Tokenizer.from_file("/tmp/nyx-current/tokenizer.json")
          if checkpoint.get("optimizer") is None:
              raise SystemExit("Canonical checkpoint has no optimizer state; cannot safely resume training")
          if checkpoint["vocab_size"]!=tokenizer.get_vocab_size():
              raise SystemExit("Canonical model and tokenizer vocabulary mismatch")
          train,valid,groups,_=make_samples(Path("/tmp/nyx-next/training_corpus.jsonl"),tokenizer,512,2026)
          if len(train)<300 or len(valid)<50:
              raise SystemExit(f"Insufficient examples: train={len(train)} validation={len(valid)}")
          start=int(checkpoint.get("step",-1))+1
          print(json.dumps({"resume_from_step":start,"new_steps":100,"train":len(train),"validation":len(valid),"groups":groups},ensure_ascii=False,indent=2))
          Path("/tmp/nyx-next/step_plan.json").write_text(json.dumps({"start_step":start,"target_step":start+100},indent=2))
          PY

      - name: Continue training from the single canonical checkpoint
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          START_STEP="$(python -c 'import json; print(json.load(open("/tmp/nyx-next/step_plan.json"))["start_step"])')"
          TARGET_STEP="$((START_STEP + 100))"
          python training/finetune_instructions.py \
            --data /tmp/nyx-next/training_corpus.jsonl \
            --tokenizer /tmp/nyx-current/tokenizer.json \
            --resume /tmp/nyx-current/model.pt \
            --steps "$TARGET_STEP" --max-steps 100 \
            --batch-size 2 --grad-accum-steps 2 \
            --block-size 512 --lr 1e-5 --warmup-steps 5 \
            --eval-every 20 --save-every 100 \
            --reset-best-loss --allow-cpu \
            --out /tmp/nyx-next/checkpoints
          cp "/tmp/nyx-next/checkpoints/sft_step_${TARGET_STEP}.pt" /tmp/nyx-next/model.pt

      - name: Export the updated Android model and run response checks
        env:
          OMP_NUM_THREADS: "2"
        run: |
          python training/export_mobile.py \
            --checkpoint /tmp/nyx-next/model.pt \
            --tokenizer /tmp/nyx-current/tokenizer.json \
            --out /tmp/nyx-next/model.onnx
          python - <<'PY'
          import json, math, random
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          from tokenizers import Tokenizer
          tok=Tokenizer.from_file("/tmp/nyx-current/tokenizer.json")
          session=ort.InferenceSession("/tmp/nyx-next/model.onnx",providers=["CPUExecutionProvider"])
          eos=tok.token_to_id("[EOS]")
          cases=[
              ("greeting","### Level: 1\n### Topic: general-conversation\n### Task type: dialogue\n### Language: ru\n### Task\nПривет!\n### Solution\n"),
              ("tokenizer","### Level: 1\n### Topic: basics\n### Task type: explain\n### Language: ru\n### Task\nОбъясни простыми словами, что делает токенизатор.\n### Solution\n"),
              ("calculator","### Level: 1\n### Topic: python-basics\n### Task type: write_code\n### Language: python\n### Task\nНапиши простой калькулятор на Python.\n### Solution\n")
          ]
          results=[]
          for name,prompt in cases:
              ids=tok.encode(prompt).ids[-512:]
              generated=[]
              rng=random.Random(20261127)
              for _ in range(120):
                  logits=session.run(["logits"],{"input_ids":np.array([ids[-512:]],dtype=np.int64)})[0][0,-1]
                  k=min(12,len(logits))
                  candidates=np.argpartition(logits,-k)[-k:]
                  candidates=sorted(candidates.tolist(),key=lambda i:float(logits[i]),reverse=True)
                  temperature=0.8
                  maximum=max(float(logits[i])/temperature for i in candidates)
                  weights=[math.exp(float(logits[i])/temperature-maximum) for i in candidates]
                  pick=rng.random()*sum(weights)
                  next_id=candidates[-1]
                  for idx,weight in zip(candidates,weights):
                      pick-=weight
                      if pick<=0:
                          next_id=idx
                          break
                  if eos is not None and next_id==eos: break
                  ids.append(next_id)
                  generated.append(next_id)
              answer=tok.decode(generated,skip_special_tokens=True)
              print(f"\n===== {name.upper()} =====\n{answer}")
              if not answer.strip():
                  raise SystemExit(f"Empty response for {name}")
              results.append({"test":name,"generated_tokens":len(generated),"answer":answer,"token_ids":generated})
          Path("/tmp/nyx-next/inference_test.json").write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Assemble one canonical package while retaining the original base backup
        run: |
          python - <<'PY'
          import hashlib, json, shutil, torch
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          from tokenizers import Tokenizer
          src=Path("/tmp/nyx-current")
          dst=Path("/tmp/nyx-next")
          shutil.copy2(src/"tokenizer.json",dst/"tokenizer.json")
          shutil.copy2(src/"base_step_600_backup.pt",dst/"base_step_600_backup.pt")
          tok=Tokenizer.from_file(str(dst/"tokenizer.json"))
          bpe=json.loads(tok.to_str()).get("model",{})
          if bpe.get("type")!="BPE" or not bpe.get("vocab") or not bpe.get("merges"):
              raise SystemExit("Canonical tokenizer is not ByteLevel BPE")
          mobile={
              "vocab":bpe["vocab"],
              "merges":[" ".join(x) if isinstance(x,list) else str(x) for x in bpe["merges"]],
              "unk_token":bpe.get("unk_token","[UNK]"),
              "eos_token":"[EOS]",
              "normalizer":"NFKC",
              "pre_tokenizer":"ByteLevel"
          }
          (dst/"tokenizer_mobile.json").write_text(json.dumps(mobile,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          previous=json.loads((src/"manifest.json").read_text(encoding="utf-8"))
          ckpt=torch.load(dst/"model.pt",map_location="cpu",weights_only=False)
          report=json.loads((dst/"corpus_report.json").read_text(encoding="utf-8"))
          manifest={
              "name":"NYXVAULT",
              "format_version":1,
              "canonical_checkpoint":"model.pt",
              "android_model":"model.onnx",
              "tokenizer":"tokenizer.json",
              "android_tokenizer":"tokenizer_mobile.json",
              "base_backup":"base_step_600_backup.pt",
              "base_pretraining_updates":600,
              "previous_manifest_checkpoint_step":previous.get("checkpoint_internal_step"),
              "checkpoint_internal_step":int(ckpt.get("step",-1))+1,
              "new_joint_sft_updates":100,
              "continuous_training":"resumed directly from the previous bundle's model.pt including optimizer state",
              "training_corpus":report,
              "checkpoint_sha256":hashlib.sha256((dst/"model.pt").read_bytes()).hexdigest(),
              "base_backup_sha256":hashlib.sha256((dst/"base_step_600_backup.pt").read_bytes()).hexdigest()
          }
          (dst/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          archive=Path("NYXVAULT_MODEL.zip")
          members=["model.pt","model.onnx","tokenizer.json","tokenizer_mobile.json","base_step_600_backup.pt","training_corpus.jsonl","manifest.json","inference_test.json"]
          with ZipFile(archive,"w",ZIP_STORED,allowZip64=True) as z:
              for name in members:
                  p=dst/name
                  if not p.is_file(): raise SystemExit(f"Missing package member: {name}")
                  z.write(p,name)
          with ZipFile(archive) as z:
              if z.testzip(): raise SystemExit("Updated model bundle failed ZIP integrity check")
              print("Updated canonical model bundle:",archive.stat().st_size,"bytes")
              print("Members:",z.namelist())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Replace the one model bundle in main via Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NYXVAULT_MODEL.zip
          git commit -m "Update the canonical NYXVAULT model"
          git pull --rebase origin main
          git push origin HEAD:main
