name: NYXVAULT real model inference test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-inference-test.yml"

permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download latest chat SFT checkpoint and matching tokenizer
        run: |
          set -euo pipefail
          mkdir -p /tmp/nyx-base /tmp/nyx-model
          curl -fL --retry 3 "https://github.com/Phantom220-hub/Nyxvault/releases/download/nyxvault-weights-600/NYXVAULT_ALL_FILES.zip" -o /tmp/nyx-base.zip
          unzip -q /tmp/nyx-base.zip -d /tmp/nyx-base
          TOKENIZER="$(find /tmp/nyx-base -type f -path '*/artifacts/tokenizer.json' -print -quit)"
          if [ -z "$TOKENIZER" ]; then TOKENIZER="$(find /tmp/nyx-base -type f -name tokenizer.json -print -quit)"; fi
          test -n "$TOKENIZER"
          curl -fL --retry 3 "https://github.com/Phantom220-hub/Nyxvault/releases/download/nyxvault-sft-chat-basics-2026-11-27/sft_step_100.pt" -o /tmp/nyx-model/sft_step_100.pt
          echo "TOKENIZER_PATH=$TOKENIZER" >> "$GITHUB_ENV"

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers onnx onnxruntime onnxscript

      - name: Export checkpoint to ONNX
        run: |
          mkdir -p /tmp/nyx-mobile
          cd training
          python export_mobile.py --checkpoint /tmp/nyx-model/sft_step_100.pt --tokenizer "$TOKENIZER_PATH" --out /tmp/nyx-mobile/nyxvault.onnx
          cp "$TOKENIZER_PATH" /tmp/nyx-mobile/tokenizer.json

      - name: Ask NYXVAULT using the same top-k sampling as Android
        run: |
          cat > /tmp/run_inference.py <<'PY'
          import json, math, random
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          from tokenizers import Tokenizer

          tokenizer = Tokenizer.from_file("/tmp/nyx-mobile/tokenizer.json")
          session = ort.InferenceSession("/tmp/nyx-mobile/nyxvault.onnx", providers=["CPUExecutionProvider"])
          eos = tokenizer.token_to_id("[EOS]")
          if eos is None:
              raise RuntimeError("Tokenizer is missing [EOS]")

          cases = [
              ("greeting", "### Level: 1\n### Topic: input-output\n### Task type: explain\n### Language: python\n### Task\nПривет\n### Solution\n"),
              ("calculator", "### Level: 1\n### Topic: functions-basics\n### Task type: write_code\n### Language: python\n### Task\nСделай простой калькулятор на Python\n### Solution\n")
          ]

          results = []
          for name, prompt in cases:
              ids = tokenizer.encode(prompt).ids[-512:]
              generated = []
              rng = random.Random(20261127)
              for _ in range(220):
                  logits = session.run(["logits"], {"input_ids": np.array([ids[-512:]], dtype=np.int64)})[0][0, -1]
                  top_k = min(12, len(logits))
                  candidates = np.argpartition(logits, -top_k)[-top_k:]
                  candidates = sorted(candidates.tolist(), key=lambda idx: float(logits[idx]), reverse=True)
                  temperature = 0.8
                  max_logit = max(float(logits[idx]) / temperature for idx in candidates)
                  weights = [math.exp(float(logits[idx]) / temperature - max_logit) for idx in candidates]
                  choice = rng.random() * sum(weights)
                  next_id = candidates[-1]
                  for idx, weight in zip(candidates, weights):
                      choice -= weight
                      if choice <= 0:
                          next_id = idx
                          break
                  if next_id == eos:
                      break
                  ids.append(next_id)
                  generated.append(next_id)
              answer = tokenizer.decode(generated, skip_special_tokens=True)
              print(f"\n===== {name.upper()} =====")
              print("Generated token count:", len(generated))
              print("Generated token IDs:", generated)
              print("Answer:\n" + answer)
              results.append({"test": name, "prompt": prompt, "token_count": len(generated), "token_ids": generated, "answer": answer})

          Path("/tmp/nyxvault-answer.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          python /tmp/run_inference.py

      - name: Upload real model answers
        uses: actions/upload-artifact@v4
        with:
          name: NYXVAULT-chat-python-inference
          path: /tmp/nyxvault-answer.json
          if-no-files-found: error
