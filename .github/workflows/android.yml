name: NYXVAULT Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyxvault-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main and fetch the canonical model bundle from Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for tokenizer parity fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install the current trained model and tokenizer into Android assets
        shell: bash
        run: |
          set -euo pipefail
          test -s NYXVAULT_MODEL.zip
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("NYXVAULT_MODEL.zip")
          assets = Path("app/src/main/assets/nyxvault_model")
          assets.mkdir(parents=True, exist_ok=True)
          tokenizer_source = Path("/tmp/nyxvault-tokenizer/tokenizer.json")
          tokenizer_source.parent.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive) as bundle:
              bad = bundle.testzip()
              if bad:
                  raise SystemExit(f"Canonical model archive failed integrity check: {bad}")
              required = {"model.onnx", "tokenizer_mobile.json", "manifest.json"}
              names = set(bundle.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f"Canonical model bundle is missing: {sorted(missing)}")

              manifest = json.loads(bundle.read("manifest.json"))
              tokenizer_source.write_bytes(bundle.read("tokenizer.json"))
              if manifest.get("android_model") != "model.onnx":
                  raise SystemExit("Manifest does not identify model.onnx as the Android model")
              if manifest.get("android_tokenizer") != "tokenizer_mobile.json":
                  raise SystemExit("Manifest does not identify tokenizer_mobile.json")

              for member, target_name in (
                  ("model.onnx", "nyxvault.onnx"),
                  ("tokenizer_mobile.json", "tokenizer_mobile.json"),
              ):
                  target = assets / target_name
                  with bundle.open(member) as source, target.open("wb") as destination:
                      shutil.copyfileobj(source, destination)

          tokenizer = json.loads((assets / "tokenizer_mobile.json").read_text(encoding="utf-8"))
          if not tokenizer.get("vocab") or not tokenizer.get("merges"):
              raise SystemExit("Android tokenizer is missing its vocabulary or BPE merges")
          model_path = assets / "nyxvault.onnx"
          if model_path.stat().st_size < 1_000_000:
              raise SystemExit("Android ONNX model is unexpectedly small or incomplete")

          print("Bundled canonical model:", model_path.stat().st_size, "bytes")
          print("Bundled tokenizer entries:", len(tokenizer["vocab"]))
          print("Canonical checkpoint step:", manifest.get("checkpoint_internal_step"))
          print("Training records:", manifest.get("training_corpus", {}).get("total_records"))
          PY
          python3 -m pip install --quiet tokenizers
          python3 training/tokenizer_parity.py \\
            --tokenizer /tmp/nyxvault-tokenizer/tokenizer.json \\
            --output app/src/main/assets/nyxvault_model/tokenizer_parity_test.json
          ls -lh app/src/main/assets/nyxvault_model/

      - name: Run Kotlin unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build APK with the latest NYXVAULT model bundled
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contains the trained model and tokenizer
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/nyxvault_model/nyxvault.onnx'
          unzip -l "$APK" | grep -q 'assets/nyxvault_model/tokenizer_mobile.json'
          echo "APK size:"
          ls -lh "$APK"
          echo "Embedded NYXVAULT model files:"
          unzip -l "$APK" | grep 'assets/nyxvault_model/'

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nyxvault-android-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: NYXVAULT Android build ${{ github.run_number }}
          body: APK contains the canonical merged NYXVAULT ONNX model and matching tokenizer from main/NYXVAULT_MODEL.zip.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
