name: NYXVAULT tokenizer and live-chat diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-diagnostics.yml"
      - "training/chat_eval.py"
      - "training/chat_eval_cases.jsonl"
      - "training/tokenizer_parity.py"
      - "training/tests/test_chat_eval.py"
      - "app/build.gradle"
      - "app/src/main/java/com/nyxvault/app/ByteLevelBpeTokenizer.kt"
      - "app/src/test/java/com/nyxvault/app/ByteLevelBpeTokenizerParityTest.kt"

permissions:
  contents: read

concurrency:
  group: nyxvault-chat-diagnostics-main
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main and fetch the canonical model from Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inference and tokenizer test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers onnxruntime

      - name: Extract the current canonical ONNX model and tokenizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          archive = Path("NYXVAULT_MODEL.zip")
          if not archive.is_file() or archive.stat().st_size < 1_000_000:
              raise SystemExit("Canonical model was not fetched from Git LFS")
          out = Path("artifacts/nyxvault_current")
          out.mkdir(parents=True, exist_ok=True)
          required = {"model.onnx", "tokenizer.json", "tokenizer_mobile.json", "manifest.json"}
          with ZipFile(archive) as bundle:
              bad = bundle.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = set(bundle.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f"Canonical bundle missing: {sorted(missing)}")
              for name in required:
                  bundle.extract(name, out)
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          print("Canonical checkpoint step:", manifest.get("checkpoint_internal_step"))
          print("Training records:", manifest.get("training_corpus", {}).get("total_records"))
          print("ONNX bytes:", (out / "model.onnx").stat().st_size)
          PY

      - name: Generate Python tokenizer golden vectors for Android
        run: |
          python training/tokenizer_parity.py \
            --tokenizer artifacts/nyxvault_current/tokenizer.json \
            --output app/src/main/assets/nyxvault_model/tokenizer_parity_test.json

      - name: Run evaluation unit tests
        run: python -m unittest training.tests.test_chat_eval -v

      - name: Set up Java and Gradle for Android tokenizer parity test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Kotlin tokenizer matches the trained tokenizer
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Talk to the current NYXVAULT model and score its replies
        env:
          OMP_NUM_THREADS: "2"
        run: |
          python training/chat_eval.py \
            --model artifacts/nyxvault_current/model.onnx \
            --tokenizer artifacts/nyxvault_current/tokenizer.json \
            --cases training/chat_eval_cases.jsonl \
            --output artifacts/chat_eval_report.json \
            --seed 20261128 \
            --max-new-tokens 120

      - name: Publish transcript and evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyxvault-chat-diagnostics-${{ github.run_number }}
          path: |
            artifacts/chat_eval_report.json
            artifacts/nyxvault_current/manifest.json
            app/src/main/assets/nyxvault_model/tokenizer_parity_test.json
          if-no-files-found: warn
          retention-days: 14
