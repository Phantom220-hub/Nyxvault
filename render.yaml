services:
  - type: web
    name: nyxvault-api
    runtime: python
    plan: free
    region: frankfurt
    branch: nyxvault-render-server
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NYXVAULT_API_TOKEN
        generateValue: true
      - key: NYXVAULT_ARCHIVE_URL
        value: https://github.com/Phantom220-hub/Nyxvault/releases/download/nyxvault-weights-600/NYXVAULT_ALL_FILES.zip
